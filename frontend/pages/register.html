<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SportVault</title>
    <!-- Importando o CSS Global e Específico -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

    <main class="glass-container auth-card">
        <header class="auth-header">
            <h2>Criar Conta</h2>
            <p>Junte-se à comunidade SportVault</p>
        </header>

        <!-- Formulário de Cadastro -->
        <form id="register-form" class="auth-form">
            <div id="error-message" class="error-msg"></div>

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" required>
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar Senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a senha" required>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Cadastrar</button>
        </form>

        <footer class="auth-footer">
            <p>Já possui uma conta? <a href="login.html">Fazer Login</a></p>
        </footer>
    </main>

    <!-- Script com lógica de cadastro usando a Fetch API -->
    <script src="../js/auth.js"></script>
</body>
</html>
